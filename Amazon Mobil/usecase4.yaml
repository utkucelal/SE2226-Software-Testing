appId: com.amazon.mShop.android.shopping
---
- launchApp:
    clearState: false
- tapOn:
    id: ".*search.*"
- inputText: "su"
- pressKey: Enter

- swipe:
    direction: UP

- tapOn: Hayat Doğal Mineralli Su 6x1,5 L
- repeat:
    times: 2
    commands:
      - swipe:
          direction: UP
- tapOn:
    id: add-to-cart-button
- assertVisible: Sepet 1 ürün 3 / 4 sekmesi
- tapOn:
    id: chrome_action_bar_back_icon_image


- tapOn: Kuzeyden Su 12 x 0,5L
- repeat:
    times: 2
    commands:
      - swipe:
          direction: UP
- tapOn:
    id: add-to-cart-button
- assertVisible: Sepet 2 ürünler 3 / 4 sekmesi


- tapOn:
    point: 50%,93%

- tapOn:
    text: Sil Kuzeyden Su 12 x 0,5L
    index: 1
- assertVisible: Sepet 1 ürün 3 / 4 sekmesi

- tapOn: Miktarı bir artırın Hayat Doğal Mineralli Su 6x1,5 L
- assertVisible: Sepet 2 ürünler 3 / 4 sekmesi

- tapOn:
    id: sc-buy-box-ptc-button

- tapOn: İPTAL ET
- tapOn:
    point: 0%,93%
- tapOn:
    point: 0%,93%



